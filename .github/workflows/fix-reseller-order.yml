name: Fix reseller order status lookup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch reseller order flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/reseller.php')
          s = p.read_text()
          old = "SELECT id FROM resellers WHERE user_id=? LIMIT 1"
          new = "SELECT id,status FROM resellers WHERE user_id=? LIMIT 1"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet -- public/reseller.php; then
            echo "Order status lookup already fixed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/reseller.php
            git commit -m "Fix reseller package order status lookup"
            git push
          fi
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-reseller-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary reseller order fix workflow"
          git push
