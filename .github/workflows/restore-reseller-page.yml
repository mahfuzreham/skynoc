name: Restore reseller page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore reseller page exact [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact known-good reseller page
        shell: bash
        run: |
          set -euo pipefail
          git show ace323caaa157efd3db42c0d95d981686c31122d:public/reseller.php > public/reseller.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/reseller.php
          git commit -m 'Restore reseller page exact [skip ci]'
          git rm .github/workflows/restore-reseller-page.yml
          git commit -m 'Remove temporary restore workflow exact [skip ci]'
          git push
